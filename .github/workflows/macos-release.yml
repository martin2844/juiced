name: Build macOS release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja pkg-config ffmpeg lua
      - name: Configure
        run: cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build out --target juiced_app juiced_tests mac_controls_check mac_controls_overlay_check mac_reflection_check mac_creative_check mac_mod_runtime_check mac_packages_check -j 3
      - name: Test
        run: ctest --test-dir out --output-on-failure
      - name: Package
        run: |
          mkdir -p package
          cp -R out/Juiced.app package/
          cp LICENSE.md package/
          cp docs/macos-build-and-run.md package/BUILD-AND-RUN.md
          printf '%s\n' 'OpenJuice by Sidewinder: https://gitlab.com/sidecr3w/openjuice' 'Apple Silicon development build. Install Homebrew FFmpeg: brew install ffmpeg' 'Game assets are not included. Open Juiced.app and choose your game folder.' 'Ad-hoc signed; not notarized. No performance guarantee.' > package/README.txt
          git rev-parse HEAD > package/SOURCE-COMMIT.txt
          otool -L package/Juiced.app/Contents/MacOS/Juiced > package/DEPENDENCIES.txt
          codesign --force --deep --sign - package/Juiced.app
          codesign --verify --deep --strict package/Juiced.app
          ditto -c -k --sequesterRsrc --keepParent package OpenJuice-0.3.3-macos-arm64.zip
          shasum -a 256 OpenJuice-0.3.3-macos-arm64.zip > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            OpenJuice-0.3.3-macos-arm64.zip
            SHA256SUMS-macos.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Native macOS Apple Silicon development build: port 0.3.3, OpenJuice base 1.01.4.

          OpenJuice was created by Sidewinder (sidecr3w): https://gitlab.com/sidecr3w/openjuice
          Required Notice: Copyright 2026 Sidewinder (https://gitlab.com/sidecr3w/openjuice)

          Install Homebrew FFmpeg (`brew install ffmpeg`), extract the app and select your own game folder. Game data is not included. This app is ad-hoc signed, not notarized, and depends on Homebrew FFmpeg libraries. Keyboard input is supported; this macOS build does not include the Android controller/touch implementation.

          This is a development build. Compatibility and performance vary; no frame-rate guarantee. Linux and Android are separate builds with a newer upstream base. Build source revision and dynamic library dependencies are recorded inside the archive. The workflow builds the app and runs CTest before publishing.
          NOTES
          if ! gh release view macos-v0.3.3 >/dev/null 2>&1; then
            gh release create macos-v0.3.3 --target "$GITHUB_SHA" --draft --prerelease --title 'OpenJuice for macOS Apple Silicon — port 0.3.3' --notes-file release-notes.md
          fi
          gh release upload macos-v0.3.3 OpenJuice-0.3.3-macos-arm64.zip SHA256SUMS-macos.txt --clobber
          gh release edit macos-v0.3.3 --draft=false --prerelease --notes-file release-notes.md
